<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Starlight 预备级 · 前三单元复习测验</title>
<style>
  :root{
    --brand:#2273a8; --brand-soft:#dceefb; --brand-tint:#eaf5fd; --brand-deep:#154d70;
    --sun:#f7c548; --sun-soft:#fef3c7; --sun-ink:#7a4e06;
    --leaf:#34d399; --leaf-soft:#d1fae5; --leaf-deep:#065f46;
    --rose:#f472b6; --rose-soft:#fce7f3;
    --grape:#a855f7; --grape-soft:#f3e8ff;
    --coral:#fb7185; --coral-soft:#ffe4e6;
    --paper:#fbf9f4; --ink:#1f2937; --ink-mute:#5b6675; --line:#e8e4da;
    --ok:#16a34a; --bad:#dc2626;
    --font-cute:'ZCOOL KuaiLe','Noto Sans SC','Microsoft YaHei',sans-serif;
    --font-sans:'Noto Sans SC','Microsoft YaHei',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font-sans);color:var(--ink);background:var(--paper);line-height:1.6;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  .wrap{max-width:1000px;margin:0 auto;padding:0 18px 80px}

  /* 顶部 */
  header.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .top-inner{max-width:1000px;margin:0 auto;padding:14px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .logo{font-family:var(--font-cute);font-size:22px;color:var(--brand-deep);display:flex;align-items:center;gap:8px}
  .logo .star{font-size:26px}
  .top-title{font-size:13px;color:var(--ink-mute);margin-left:auto}
  nav.tabs{display:flex;gap:8px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:63px;z-index:19;padding:10px 18px;justify-content:center;flex-wrap:wrap}
  nav.tabs button{border:1.5px solid var(--line);background:#fff;color:var(--ink-mute);padding:9px 20px;border-radius:999px;font-weight:700;font-size:15px;transition:.15s}
  nav.tabs button:hover{border-color:var(--brand);color:var(--brand)}
  nav.tabs button.active{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 3px 10px rgba(34,115,168,.25)}
  .panel{display:none;padding-top:24px}
  .panel.active{display:block}

  h2.sec{font-family:var(--font-cute);font-size:22px;color:var(--ink);margin:6px 0 14px;display:flex;align-items:center;gap:8px}
  .hint-line{color:var(--ink-mute);font-size:13px;margin-bottom:14px}

  /* 单元/课选择 */
  .picker{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .chip{border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:9px 16px;font-weight:700;font-size:14px;transition:.15s}
  .chip:hover{border-color:var(--brand)}
  .chip.active{color:#fff;border-color:transparent}
  .chip.u1.active{background:var(--brand)}
  .chip.u2.active{background:var(--leaf-deep)}
  .chip.u3.active{background:var(--grape)}
  .lesson-picker{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px}
  .lesson-picker button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-size:13px;color:var(--ink-mute);font-weight:600}
  .lesson-picker button.active{background:var(--sun-soft);border-color:var(--sun);color:var(--sun-ink)}

  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px}
  .card h3{font-family:var(--font-cute);font-size:18px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .badge{font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;color:var(--ink-mute);background:#f1efe9}

  /* 单词网格 */
  .word-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .word-card{background:var(--brand-tint);border:1.5px solid var(--brand-soft);border-radius:14px;padding:14px;text-align:center;cursor:pointer;transition:.15s;position:relative;min-height:120px}
  .word-card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(34,115,168,.12)}
  .word-card .emoji{font-size:34px;line-height:1}
  .word-card .en{font-family:var(--font-cute);font-size:19px;color:var(--brand-deep);margin-top:6px;word-break:break-word}
  .word-card .ipa{font-size:11px;color:var(--ink-mute)}
  .word-card .zh{font-size:15px;color:var(--ink);margin-top:4px;font-weight:600}
  .word-card .spk{position:absolute;top:6px;right:8px;border:none;background:rgba(255,255,255,.7);border-radius:50%;width:28px;height:28px;font-size:14px}
  .word-card.hide-zh .zh{filter:blur(6px);opacity:.5}
  .word-card.hide-zh:hover .zh{filter:none;opacity:1}

  /* 句子/对话/短文 */
  .sent-row{padding:9px 12px;border-left:3px solid var(--sun);background:var(--sun-soft);border-radius:0 10px 10px 0;margin-bottom:9px;cursor:pointer}
  .sent-row .en{font-weight:700;font-size:16px}
  .sent-row .zh{color:var(--ink-mute);font-size:14px;margin-top:2px}
  .dlg-row{display:flex;gap:10px;margin-bottom:10px;align-items:flex-start}
  .dlg-row .who{flex:0 0 34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;font-size:14px}
  .dlg-row.T .who{background:var(--brand)}
  .dlg-row.S .who{background:var(--coral)}
  .dlg-row .bubble{background:#f7f6f2;border-radius:10px;padding:8px 12px;cursor:pointer;flex:1}
  .dlg-row .bubble .en{font-weight:600}
  .dlg-row .bubble .zh{font-size:13px;color:var(--ink-mute)}
  .story .sent-row{border-left-color:var(--leaf);background:var(--leaf-soft)}
  .song-row{border-left-color:var(--rose);background:var(--rose-soft)}
  .empty{color:var(--ink-mute);font-size:13px;padding:10px;font-style:italic}

  /* 测验 */
  .quiz-setup{text-align:center;padding:30px 20px}
  .quiz-setup h2{font-family:var(--font-cute);font-size:26px;margin-bottom:10px}
  .quiz-opts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:20px 0}
  .quiz-opts .chip.active{background:var(--brand)}
  .btn-big{border:none;background:var(--brand);color:#fff;padding:14px 40px;border-radius:999px;font-size:18px;font-weight:800;box-shadow:0 4px 14px rgba(34,115,168,.3)}
  .btn-big:hover{background:var(--brand-deep)}
  .quiz-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:700;color:var(--ink-mute)}
  .progressbar{height:8px;background:#eee;border-radius:99px;overflow:hidden;margin-bottom:18px}
  .progressbar > i{display:block;height:100%;background:var(--brand);width:0;transition:.3s}
  .q-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;text-align:center}
  .q-type{font-size:12px;font-weight:700;color:var(--brand);background:var(--brand-soft);padding:3px 12px;border-radius:99px;display:inline-block;margin-bottom:16px}
  .q-prompt{font-family:var(--font-cute);font-size:30px;margin-bottom:6px;word-break:break-word}
  .q-sub{color:var(--ink-mute);font-size:14px;margin-bottom:22px}
  .q-options{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:620px;margin:0 auto}
  .q-opt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:14px;font-size:17px;font-weight:600;transition:.12s;min-height:56px;display:flex;align-items:center;justify-content:center;gap:8px}
  .q-opt:hover:not(:disabled){border-color:var(--brand);background:var(--brand-tint)}
  .q-opt.correct{border-color:var(--ok);background:var(--leaf-soft);color:var(--leaf-deep)}
  .q-opt.wrong{border-color:var(--bad);background:var(--coral-soft);color:var(--bad)}
  .q-opt:disabled{cursor:default}
  .q-feedback{margin-top:18px;font-weight:700;min-height:26px;font-size:16px}
  .q-feedback.ok{color:var(--ok)} .q-feedback.bad{color:var(--bad)}
  .letter-opt{font-family:var(--font-cute);font-size:26px}
  .btn-next{margin-top:18px;border:none;background:var(--brand);color:#fff;padding:12px 32px;border-radius:999px;font-weight:800;font-size:16px}
  .result{text-align:center;padding:30px 20px}
  .result .score{font-family:var(--font-cute);font-size:64px;color:var(--brand)}
  .result .grade{font-size:22px;font-weight:800;margin:6px 0 18px}
  .wrong-list{text-align:left;max-width:600px;margin:0 auto 20px}
  .wrong-item{background:#fff;border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:10px;padding:10px 14px;margin-bottom:8px;font-size:14px}

  /* 字母描红 */
  .trace-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  .trace-toolbar select,.trace-toolbar button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:700;font-size:14px;color:var(--ink)}
  .trace-toolbar button:hover{border-color:var(--brand);color:var(--brand)}
  .trace-wrap{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
  .trace-box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center}
  .trace-box .lbl{font-weight:700;color:var(--ink-mute);margin-bottom:8px;font-size:14px}
  .trace-box canvas{background:#fff;border:2px solid var(--brand-soft);border-radius:10px;touch-action:none;cursor:crosshair}
  .trace-word{font-family:var(--font-cute);font-size:22px;color:var(--brand-deep);margin-top:8px}
  .trace-tip{font-size:12px;color:var(--ink-mute);margin-top:4px}

  footer{text-align:center;color:var(--ink-mute);font-size:12px;padding:30px 0}
  @media(max-width:600px){.q-options{grid-template-columns:1fr}.top-title{display:none}nav.tabs{top:60px}}
  @media print{nav.tabs,header.top,.picker,.lesson-picker,.trace-toolbar,.btn-big,.btn-next{display:none!important}.panel{display:block!important}}
</style>
</head>
<body>
<header class="top"><div class="top-inner">
  <div class="logo"><span class="star">⭐</span> Starlight 前三单元复习</div>
  <div class="top-title">预备级 · Unit 1–3 · 会读 · 会认 · 中英互译 · 字母书写</div>
</div></header>

<nav class="tabs">
  <button data-panel="review" class="active">📖 复习浏览</button>
  <button data-panel="quiz">✏️ 综合测验</button>
  <button data-panel="trace">✍️ 字母描红</button>
</nav>

<div class="wrap">
  <!-- 复习浏览 -->
  <section class="panel active" id="panel-review">
    <div class="picker" id="unitPicker"></div>
    <div class="lesson-picker" id="lessonPicker"></div>
    <div id="reviewContent"></div>
  </section>

  <!-- 测验 -->
  <section class="panel" id="panel-quiz">
    <div id="quizSetup" class="card quiz-setup">
      <h2>✏️ 综合测验</h2>
      <p class="hint-line">覆盖前三单元的单词、句型、字母。点一个选项立即出结果，最后给成绩单和错题回顾。</p>
      <div class="quiz-opts" id="quizCountOpts">
        <button class="chip active" data-n="10">10 题</button>
        <button class="chip" data-n="20">20 题</button>
        <button class="chip" data-n="30">30 题</button>
      </div>
      <div class="quiz-opts" id="quizTypeOpts">
        <button class="chip active" data-t="all">全部题型</button>
        <button class="chip" data-t="word_en2zh">单词英→中</button>
        <button class="chip" data-t="word_zh2en">单词中→英</button>
        <button class="chip" data-t="sentence">句型互译</button>
        <button class="chip" data-t="letter">字母大小写</button>
      </div>
      <button class="btn-big" id="startQuiz">开始测验 →</button>
    </div>
    <div id="quizRun" style="display:none">
      <div class="quiz-head"><span id="qProgressText"></span><span id="qScoreText"></span></div>
      <div class="progressbar"><i id="qBar"></i></div>
      <div class="q-card" id="qCard"></div>
    </div>
    <div id="quizResult" style="display:none"></div>
  </section>

  <!-- 字母描红 -->
  <section class="panel" id="panel-trace">
    <h2 class="sec">✍️ 字母手写体描红</h2>
    <p class="hint-line">在四线三格里临摹大小写字母。选字母 → 看范例 → 用鼠标或手指书写。范例可隐藏后自测。</p>
    <div class="trace-toolbar">
      <label>字母：<select id="letterSelect"></select></label>
      <button id="toggleGuide">🙈 隐藏范例</button>
      <button id="clearTrace">🧽 清除重写</button>
    </div>
    <div class="trace-wrap" id="traceWrap"></div>
  </section>

  <footer>数据来自 Starlight 预备级教材 · 本页为离线复习工具，可用浏览器朗读英文发音</footer>
</div>

<script>
const DATA = __DATA__;

/* ---------- 通用 ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
function speak(text){
  try{
    if(!('speechSynthesis' in window))return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US'; u.rate=0.85;
    speechSynthesis.speak(u);
  }catch(e){}
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ---------- Tab 切换 ---------- */
$$('nav.tabs button').forEach(b=>b.onclick=()=>{
  $$('nav.tabs button').forEach(x=>x.classList.remove('active'));
  $$('.panel').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  $('#panel-'+b.dataset.panel).classList.add('active');
  if(b.dataset.panel==='trace') initTrace();
});

/* ---------- 复习浏览 ---------- */
let curUnit=1, curLesson=1;
function renderPickers(){
  const up=$('#unitPicker'); up.innerHTML='';
  DATA.units.forEach(u=>{
    const b=document.createElement('button');
    b.className='chip u'+u.id+(u.id===curUnit?' active':'');
    b.textContent=u.emoji+' Unit '+u.id+' · '+u.titleZh;
    b.onclick=()=>{curUnit=u.id;curLesson=1;renderPickers();renderReview()};
    up.appendChild(b);
  });
  const lp=$('#lessonPicker'); lp.innerHTML='';
  const unit=DATA.units.find(u=>u.id===curUnit);
  unit.lessons.forEach(l=>{
    const b=document.createElement('button');
    b.textContent='L'+l.id+' '+l.titleZh;
    if(l.id===curLesson)b.classList.add('active');
    b.onclick=()=>{curLesson=l.id;renderPickers();renderReview()};
    lp.appendChild(b);
  });
}
function wordCard(w){
  return `<div class="word-card hide-zh" onclick="this.classList.toggle('hide-zh')">
    <button class="spk" onclick="event.stopPropagation();speak('${w.en.replace(/'/g,"\\'")}')">🔊</button>
    <div class="emoji">${w.emoji}</div><div class="en">${w.en}</div>
    <div class="ipa">${w.ipa}</div><div class="zh">${w.zh}</div>
  </div>`;
}
function sentRow(s){
  return `<div class="sent-row" onclick="speak('${s.en.replace(/'/g,"\\'")}')">
    <div class="en">🔊 ${s.en}</div><div class="zh">${s.zh}</div></div>`;
}
function renderReview(){
  const u=DATA.units.find(x=>x.id===curUnit);
  const l=u.lessons.find(x=>x.id===curLesson);
  let h=`<h2 class="sec">Unit ${u.id} · ${u.titleZh} — Lesson ${l.id} ${l.titleZh}</h2>`;
  h+=`<div class="hint-line">点击单词卡翻开中文（再点藏回去）；点 🔊 或句子听发音。本课单词 ${l.words.length} · 句型 ${l.sentences.length}</div>`;
  // 单词
  h+=`<div class="card"><h3>🔤 单词表 <span class="badge">点卡片翻中英</span></h3><div class="word-grid">${l.words.map(wordCard).join('')}</div></div>`;
  // 句型
  h+=`<div class="card"><h3>💬 核心句型</h3>${l.sentences.map(sentRow).join('')||'<div class="empty">暂无</div>'}`;
  if(l.frames.length){h+=`<div style="margin-top:14px;border-top:1px dashed var(--line);padding-top:12px"><b style="font-size:14px;color:var(--ink-mute)">句型填空卡：</b>`;
    l.frames.forEach(f=>{h+=`<div class="sent-row" style="border-left-color:var(--grape);background:var(--grape-soft)" onclick="speak('${f.pattern.replace(/___/g,f.blanks[0]?f.blanks[0].options[f.blanks[0].answer]:'').replace(/'/g,"\\'")}')"><div class="en">${f.pattern}</div><div class="zh">${f.zh} ${f.hint?'· '+f.hint:''}</div></div>`});
    h+='</div>'}
  h+='</div>';
  // 歌曲
  if(l.songs.length){
    h+=`<div class="card"><h3>🎵 歌曲 / Chant</h3>${l.songs.map(s=>`<div class="sent-row song-row" onclick="speak('${s.en.replace(/'/g,"\\'")}')"><div class="en">🔊 ${s.en}</div><div class="zh">${s.zh}</div></div>`).join('')}</div>`;
  }
  // 短文
  if(l.reading){
    h+=`<div class="card"><h3>📖 小故事 · ${l.reading.titleZh}</h3><div class="story">${l.reading.sentences.map(sentRow).join('')}</div></div>`;
  }
  // 对话
  if(l.dialogue.length){
    h+=`<div class="card"><h3>🗣️ 外教课堂对话 <span class="badge">T=老师 S=学生</span></h3>`;
    l.dialogue.forEach(t=>{h+=`<div class="dlg-row ${t.speaker}"><div class="who">${t.speaker}</div><div class="bubble" onclick="speak('${t.en.replace(/'/g,"\\'")}')"><div class="en">🔊 ${t.en}</div>${t.zh?`<div class="zh">${t.zh}</div>`:''}</div></div>`});
    h+='</div>';
  }
  $('#reviewContent').innerHTML=h;
}

/* ---------- 测验 ---------- */
let quizCfg={n:10,t:'all'}, questions=[], qIdx=0, qScore=0, wrongs=[], answered=false;
$('#quizCountOpts').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;$$('#quizCountOpts .chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');quizCfg.n=+b.dataset.n};
$('#quizTypeOpts').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;$$('#quizTypeOpts .chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');quizCfg.t=b.dataset.t};
$('#startQuiz').onclick=()=>{buildQuestions();qIdx=0;qScore=0;wrongs=[];$('#quizSetup').style.display='none';$('#quizResult').style.display='none';$('#quizRun').style.display='block';showQuestion()};

// 收集题库素材
function allWords(){const a=[];DATA.units.forEach(u=>u.lessons.forEach(l=>l.words.forEach(w=>a.push(w))));return a}
function allSentences(){const a=[];DATA.units.forEach(u=>u.lessons.forEach(l=>l.sentences.forEach(s=>{if(s.zh&&s.zh.length<40)a.push(s)})));return a}
function pickN(arr,n){return shuffle([...arr]).slice(0,n)}

// 干扰项:排除同英文(避免 missing/orange 双释义歧义)与同中文,并保证选项文本唯一
function uniqueDistract(pool, w, getText, n){
  const used=new Set([getText(w)]);
  const out=[];
  for(const x of shuffle([...pool])){
    if(x.en===w.en||x.zh===w.zh)continue;
    const t=getText(x);
    if(used.has(t))continue;
    used.add(t);out.push(x);
    if(out.length>=n)break;
  }
  return out;
}
function makeWordQ(w,type){
  const pool=allWords();
  if(type==='word_en2zh'){
    const opts=shuffle([w,...uniqueDistract(pool,w,o=>o.zh,3)]);
    return {type:'单词 · 英→中',prompt:w.en,sub:'选出正确的中文意思',speak:w.en,options:opts.map(o=>o.zh),answer:opts.indexOf(w),explain:w.en+' = '+w.zh};
  }else{
    const opts=shuffle([w,...uniqueDistract(pool,w,o=>o.en,3)]);
    return {type:'单词 · 中→英',prompt:w.zh,sub:'选出正确的英文单词',options:opts.map(o=>o.en),answer:opts.indexOf(w),explain:w.zh+' = '+w.en,speak:w.en};
  }
}
function makeSentenceQ(s){
  const pool=allSentences();
  const en2zh=Math.random()<.5;
  const distract=uniqueDistract(pool,s,en2zh?o=>o.zh:o=>o.en,3);
  const opts=shuffle([s,...distract]);
  if(en2zh)return {type:'句型 · 英→中',prompt:s.en,sub:'选出正确的中文',speak:s.en,options:opts.map(o=>o.zh),answer:opts.indexOf(s),explain:s.en+' = '+s.zh};
  return {type:'句型 · 中→英',prompt:s.zh,sub:'选出正确的英文',options:opts.map(o=>o.en),answer:opts.indexOf(s),explain:s.zh+' = '+s.en,speak:s.en};
}
function makeLetterQ(){
  const als=DATA.alphabet;
  const mode=Math.random();
  const a=als[Math.floor(Math.random()*als.length)];
  if(mode<.4){ // 大写配小写
    const distract=pickN(als.filter(x=>x.lower!==a.lower),3);
    const opts=shuffle([a,...distract]);
    return {type:'字母 · 大小写',prompt:a.upper,sub:'选出对应的小写字母',options:opts.map(o=>o.lower),answer:opts.indexOf(a),explain:a.upper+' → '+a.lower,letter:true};
  }else{ // 首字母配单词
    const distract=pickN(als.filter(x=>x.word!==a.word),3);
    const opts=shuffle([a,...distract]);
    return {type:'字母 · 首字母',prompt:a.upper,sub:'哪个单词以这个字母开头？',options:opts.map(o=>o.word+' '+o.emoji),answer:opts.indexOf(a),explain:a.upper+' for '+a.word,letter:true};
  }
}
function buildQuestions(){
  const n=quizCfg.n, t=quizCfg.t;
  const mk=[];
  if(t==='all'||t==='word_en2zh'||t==='word_zh2en'){
    const ws=pickN(allWords(),Math.ceil(n/2));
    ws.forEach(w=>mk.push(()=>makeWordQ(w,t==='all'?(Math.random()<.5?'word_en2zh':'word_zh2en'):t)));
  }
  if(t==='all'||t==='sentence'){
    pickN(allSentences(),Math.max(2,Math.floor(n/4))).forEach(s=>mk.push(()=>makeSentenceQ(s)));
  }
  if(t==='all'||t==='letter'){
    const need=n-mk.length;
    for(let i=0;i<Math.max(need,2);i++)mk.push(()=>makeLetterQ());
  }
  questions=shuffle(mk).slice(0,n).map(f=>f());
}
function showQuestion(){
  answered=false;
  const q=questions[qIdx];
  $('#qProgressText').textContent=`第 ${qIdx+1} / ${questions.length} 题`;
  $('#qScoreText').textContent=`✓ ${qScore}`;
  $('#qBar').style.width=(qIdx/questions.length*100)+'%';
  let h=`<div class="q-type">${q.type}</div><div class="q-prompt">${q.prompt}</div><div class="q-sub">${q.sub}${q.speak?' · 点下面的 🔊 听发音':''}</div>`;
  if(q.speak)h+=`<div style="margin-bottom:14px"><button onclick="speak('${q.speak.replace(/'/g,"\\'")}')" style="border:none;background:var(--sun-soft);color:var(--sun-ink);border-radius:99px;padding:6px 18px;font-weight:700">🔊 听一听</button></div>`;
  h+=`<div class="q-options">${q.options.map((o,i)=>`<button class="q-opt${q.letter?' letter-opt':''}" data-i="${i}">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div>`;
  h+=`<div class="q-feedback" id="qFeedback"></div><div id="qNextWrap"></div>`;
  $('#qCard').innerHTML=h;
  $$('.q-opt').forEach(b=>b.onclick=()=>answer(Number(b.dataset.i)));
}
function answer(i){
  if(answered)return;answered=true;
  const q=questions[qIdx], ok=i===q.answer;
  $$('.q-opt').forEach((b,idx)=>{b.disabled=true;if(idx===q.answer)b.classList.add('correct');else if(idx===i)b.classList.add('wrong')});
  const fb=$('#qFeedback');
  if(ok){qScore++;fb.className='q-feedback ok';fb.textContent='✓ 答对啦！ '+q.explain}
  else{fb.className='q-feedback bad';fb.textContent='✗ 正确答案：'+q.options[q.answer]+'（'+q.explain+'）';wrongs.push({prompt:q.prompt,answer:q.options[q.answer],explain:q.explain})}
  $('#qScoreText').textContent=`✓ ${qScore}`;
  $('#qNextWrap').innerHTML=`<button class="btn-next" id="nextBtn">${qIdx===questions.length-1?'看成绩 →':'下一题 →'}</button>`;
  $('#nextBtn').onclick=()=>{qIdx++;if(qIdx<questions.length)showQuestion();else showResult()};
}
function showResult(){
  $('#quizRun').style.display='none';$('#quizResult').style.display='block';
  const pct=Math.round(qScore/questions.length*100);
  const grade=pct>=90?'🏆 太棒了！':pct>=70?'👍 不错哦！':pct>=60?'🙂 继续加油！':'💪 再练一练！';
  let h=`<div class="result"><div class="score">${pct}分</div><div class="grade">${grade}</div>`;
  h+=`<p class="hint-line">答对 ${qScore} / ${questions.length} 题</p>`;
  if(wrongs.length){h+=`<div class="wrong-list"><h3 style="font-family:var(--font-cute);margin-bottom:10px">📕 错题回顾</h3>`;
    wrongs.forEach(w=>{h+=`<div class="wrong-item"><b>${w.prompt}</b> → ${w.answer}<br><span style="color:var(--ink-mute)">${w.explain}</span></div>`});h+='</div>'}
  h+=`<button class="btn-big" onclick="$('#quizResult').style.display='none';$('#quizSetup').style.display='block'">再测一次</button></div>`;
  $('#quizResult').innerHTML=h;
}

/* ---------- 字母描红 ---------- */
let curLetter=0, showGuide=true;
function initTrace(){
  const sel=$('#letterSelect');
  if(!sel.options.length){
    DATA.alphabet.forEach((l,i)=>{const o=document.createElement('option');o.value=i;o.textContent=l.upper+' '+l.lower+' ('+l.word+')';sel.appendChild(o)});
    sel.onchange=()=>{curLetter=+sel.value;drawTrace()};
    $('#clearTrace').onclick=()=>{const c=$('#traceCanvasU'),c2=$('#traceCanvasL');if(c)c.getContext('2d').clearRect(0,0,c.width,c.height);if(c2)c2.getContext('2d').clearRect(0,0,c2.width,c2.height)};
    $('#toggleGuide').onclick=()=>{showGuide=!showGuide;$('#toggleGuide').textContent=showGuide?'🙈 隐藏范例':'👀 显示范例';drawTrace()};
  }
  drawTrace();
}
function setupCanvas(canvas,guideChar,isUpper){
  const ctx=canvas.getContext('2d');const W=canvas.width,H=canvas.height;
  ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
  // 四线三格
  ctx.strokeStyle='#dbeafe';ctx.lineWidth=1;
  const top=30,b2=70,b3=110,bot=150;
  [top,b2,b3,bot].forEach(y=>{ctx.beginPath();ctx.moveTo(8,y);ctx.lineTo(W-8,y);ctx.stroke()});
  ctx.strokeStyle='#93c5fd';ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(8,(b2+b3)/2);ctx.lineTo(W-8,(b2+b3)/2);ctx.stroke();ctx.setLineDash([]);
  if(showGuide){
    ctx.fillStyle='rgba(34,115,168,.16)';
    ctx.font='110px "ZCOOL KuaiLe", sans-serif';ctx.textAlign='center';ctx.textBaseline='alphabetic';
    ctx.fillText(guideChar,W/2,125);
  }
  // 手写
  let drawing=false;
  const pos=e=>{const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}};
  canvas.onpointerdown=e=>{drawing=true;ctx.beginPath();ctx.strokeStyle='#1f2937';ctx.lineWidth=3.5;ctx.lineCap='round';ctx.lineJoin='round';const p=pos(e);ctx.moveTo(p.x,p.y);canvas.setPointerCapture(e.pointerId)};
  canvas.onpointermove=e=>{if(!drawing)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke()};
  canvas.onpointerup=()=>{drawing=false};
  canvas.onpointercancel=()=>{drawing=false};
}
function drawTrace(){
  const l=DATA.alphabet[curLetter];
  $('#letterSelect').value=curLetter;
  $('#traceWrap').innerHTML=`
    <div class="trace-box"><div class="lbl">大写 ${l.upper}</div>
      <canvas id="traceCanvasU" width="220" height="180"></canvas>
      <div class="trace-word">${l.upper} for ${l.word} ${l.emoji}</div><div class="trace-tip">${l.ipa}</div></div>
    <div class="trace-box"><div class="lbl">小写 ${l.lower}</div>
      <canvas id="traceCanvasL" width="220" height="180"></canvas>
      <div class="trace-word">${l.lower} for ${l.word} ${l.emoji}</div><div class="trace-tip">点单词听发音</div></div>`;
  setupCanvas($('#traceCanvasU'),l.upper,true);
  setupCanvas($('#traceCanvasL'),l.lower,false);
  $$('.trace-word').forEach((el,i)=>el.style.cursor='pointer');
  $$('.trace-word')[0].onclick=()=>speak(l.word);
  $$('.trace-word')[1].onclick=()=>speak(l.word);
}

/* ---------- 启动 ---------- */
renderPickers();renderReview();
</script>
