name: Deploy to GitHub Pages

# 推送到 main 分支时自动部署
on:
  push:
    branches: [main]
  # 合并前就先跑门禁：不必等到推到 main 才知道单测挂了
  pull_request:
    branches: [main]
  # 允许手动触发
  workflow_dispatch:

# GitHub Pages 部署权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 质量门禁：lint + 单测。
  # 之前这里没有任何测试检查项——deploy.yml 只有一个 npm run build，
  # 导致 npm test / npm run lint 全靠人工执行，测试写坏了照样能部署。
  # 与 build 并行执行，不额外拉长总耗时。
  quality:
    name: 质量门禁
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          # 注意：jsdom 27 要求 >=20.19（vitest 4 要求 >=20）。
          # setup-node 的 `20` 会装最新 20.x，天然满足；不要改成固定小版本。
          # 若将来要把 Node 升到 22，同步确认 AGENTS.md 里的「构建需 Node≥20」说明。
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: 单元测试
        run: npm run test

      # e2e 用例的类型检查。tsconfig.json 只 include src，覆盖不到 tests/**；
      # src 自身的类型检查已由 build job 的 tsc -b 负责，这里不重复。
      - name: E2E 用例类型检查
        run: npm run check:e2e

  build:
    name: 构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建
        # GITHUB_REPOSITORY 环境变量会被 Vite 读取,自动设置正确的 base 路径
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: [quality, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
